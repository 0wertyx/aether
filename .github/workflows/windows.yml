name: Windows preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm test
      - run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-Windows-preview
          path: src-tauri/target/release/aether-desktop.exe
          if-no-files-found: error
      - name: Publish Windows preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-preview.${{ github.run_number }}.${{ github.run_attempt }}"
          Copy-Item src-tauri/target/release/aether-desktop.exe AETHER-Windows.exe
          gh release create $tag AETHER-Windows.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "AETHER Desktop $tag" --notes "Unsigned Windows preview. Standalone simulator and live data updates." --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
