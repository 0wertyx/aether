name: Windows signed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Next desktop version, e.g. 0.1.1 (must increase)"
        required: true
        default: "0.1.1"
        type: string
permissions:
  contents: write
concurrency:
  group: aether-desktop-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm test
      - name: Configure signed installer
        shell: pwsh
        env:
          AETHER_VERSION: ${{ inputs.version }}
          TAURI_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Set signing key secret and public key variable first (README)." }
          node scripts/prepare-release.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: AETHER Desktop v${{ inputs.version }}
          releaseBody: "Signed AETHER Desktop installer with in-app updates."
          releaseDraft: false
          prerelease: false
